<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="https://status.druidcdp.net/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <title>Druidcdp.net - Error 1033</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: #111;
      color: #eee;
      font-family: Roboto, Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 600px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 2.5rem;
    }

    h2 {
      margin: 0 0 24px;
      color: #EDAD0B;
      font-size: 1.5rem;
    }

    p {
      line-height: 1.7;
      color: #ccc;
    }

    a {
      color: #FFD54A;
      font-weight: bold;
      text-decoration: underline;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <main>
    <h1>Error, Error!</h1>
    <h2>Error 1033</h2>

    <p>
      It seems we're currently unable to fulfil your request.
      The server may be temporarily unavailable.
    </p>

    <p>
      Check the
      <strong><a href="https://status.druidcdp.net">status page</a></strong>,
      or try again in a few minutes.
    </p>
  </main>
</body>
</html>
